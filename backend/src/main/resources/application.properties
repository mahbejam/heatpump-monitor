spring.application.name=backend
server.port=8080

# Health-Endpoint für Docker/Kubernetes (Tag 6-8)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.datasource.url=jdbc:postgresql://localhost:5433/heatpump
spring.datasource.username=heatpump
spring.datasource.password=local_demo_only

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false