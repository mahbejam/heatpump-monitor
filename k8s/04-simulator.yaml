apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: heatpump-monitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: heatpump-monitor-simulator:latest
          imagePullPolicy: Never
          env:
            - name: API_URL
              value: http://backend:8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi