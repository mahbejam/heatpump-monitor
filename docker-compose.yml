services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: heatpump
      POSTGRES_USER: heatpump
      POSTGRES_PASSWORD: local_demo_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatpump -d heatpump"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/heatpump
      SPRING_DATASOURCE_USERNAME: heatpump
      SPRING_DATASOURCE_PASSWORD: local_demo_only
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      backend:
        condition: service_started

  simulator:
    build:
      context: ./simulator
    environment:
      API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_started
    profiles:
      - demo

volumes:
  postgres_data: